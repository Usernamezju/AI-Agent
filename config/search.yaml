# ---- BM25 ----
bm25:
  k1: 1.5                         # term saturation parameter
  b: 0.75                         # length normalization parameter
  default_top_k: 5                # default result count
  score_precision: 4              # decimal places for score rounding

# ---- Snippet generation ----
snippet:
  context_window_before: 60       # chars before first match
  context_window_after: 60        # chars after first match
  fallback_length: 120            # snippet length when no query match found

# ---- AI re-ranker ----
reranker:
  candidate_pool_max: 10          # max BM25 candidates sent to LLM
  default_top_k: 3                # results after re-ranking

# ---- SearchEngine facade ----
search:
  default_top_k: 5
  bm25_multiplier: 2              # BM25 retrieves top_k * multiplier for re-ranker
