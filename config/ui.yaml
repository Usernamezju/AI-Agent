# =============================================================================
# UI Configuration — Streamlit / Chainlit display constants
# =============================================================================

# ---- Streamlit UI ----
streamlit:
  page_title: "AI Agent"
  layout: wide
  css_file: ui/static/style.css

  # Chat input placeholder
  chat_input_placeholder: "输入任务…"

  # File upload
  file_upload:
    text_preview_max_chars: 300
    image_description_preview_max_chars: 300
    supported_label: "支持 txt / csv / json / pdf 等文本文件"

  # Search
  search:
    result_title_max_chars: 18
    snippet_highlight_token: "**"

  # Conversation history sidebar
  conversation_history:
    max_list_items: 50
    title_max_chars: 18
    title_ellipsis: "…"
    date_groups:
      - 今天
      - 昨天
      - 更早
    default_title: "未命名对话"

  # Visualization
  visualization:
    iframe_height: 420
    scrolling: false

  # Multi-agent panel
  multi_agent:
    toggle_label: "启用多智能体模式"
    toggle_help: "开启后，复杂任务将被自动拆解为子任务并行执行"
    task_desc_max_chars: 30
    planning_placeholder: "⏳ *多智能体规划中...*"
    executing_placeholder: "⏳ *任务规划完成，执行子任务中...*"

  # Single-agent
  single_agent:
    thinking_placeholder: "⏳ *Thinking...*"

  # Long-term memory panel
  ltm_panel:
    expanded: true

  # New conversation button
  new_conversation_label: "🆕 新对话"

  # Search bar
  search_bar:
    label: "🔍 搜索对话"
    ai_toggle_label: "AI 语义"
    clear_button_label: "✕ 清除搜索"

# ---- Thought tracker component ----
thought_tracker:
  auto_expand_first_n_rounds: 2
  observation_max_chars: 2000
  raw_output_max_chars: 1000

# ---- Tool visualizer component ----
tool_visualizer:
  colors:
    calculator: "#2196F3"
    wikipedia_search: "#4CAF50"
    local_filesystem: "#FF9800"
    code_interpreter: "#9C27B0"
    visualize: "#E91E63"
    memory_store: "#00BCD4"
    memory_recall: "#607D8B"
    perspective_debate: "#795548"

# ---- CSS theme ----
theme:
  thought_block:
    background: "#f8f9fa"
    border_left: "3px solid #9e9e9e"
    padding: "0.5rem 1rem"
    font_family: "monospace"
  action_block:
    border_left: "3px solid #2196F3"
  observation_block:
    border_left: "3px solid #FF9800"
  error_block:
    border_left: "3px solid #f44336"
  final_block:
    border_left: "3px solid #9C27B0"

# ---- Chainlit UI ----
chainlit:
  project_name: "AI Agent Framework"
  enable_telemetry: false
  prompt_playground: false
  multi_modal: false
  ui_name: "AI Agent"
  ui_description: "基于 ReAct 范式的 AI Agent，浙江大学人工智能基础实验"
  default_theme: dark
  theme_primary: "#7C3AED"
  theme_background: "#0F0F0F"
  theme_paper: "#1A1A1A"
  meta_version: "1.0.0"

  # Welcome message examples
  welcome_examples:
    - label: "📐 数学计算"
      name: example_1
      value: "计算 (2^10 - 1) × 3.14"
    - label: "🔍 百科搜索"
      name: example_2
      value: "搜索图灵奖的介绍"
    - label: "📁 文件操作"
      name: example_3
      value: "列出当前沙箱目录的文件"

  # Slash commands
  commands:
    memory: "/memory"
    clear_memory: "/clear_memory"
    forget: "/forget"

# ---- CLI ----
cli:
  exit_commands:
    - quit
    - exit
    - q
  banner_width: 50
  tools_listed: "calculator, wikipedia_search, local_filesystem"
